name: Regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test isolated audio logic and worker lifecycle
        run: PYTHONPATH=bin python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q bin
